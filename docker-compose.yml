services:
  db:
    image: postgres:16-alpine
    container_name: dqe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dqe
      POSTGRES_PASSWORD: dqe
      POSTGRES_DB: dqe
    ports:
      # Host port 5433 (not 5432) — this machine already runs a native
      # Postgres on 5432, and mapping onto it would silently connect the
      # app to the wrong database.
      - "5433:5432"
    volumes:
      - dqe_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dqe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dqe_backend
    restart: unless-stopped
    environment:
      # Container-to-container hostname/port (Postgres's own 5432, not the
      # host-mapped 5433 used by tools running outside Docker).
      DATABASE_URL: postgresql+psycopg2://dqe:dqe@db:5432/dqe
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERT_HEALTH_SCORE_THRESHOLD: ${ALERT_HEALTH_SCORE_THRESHOLD:-70}
    ports:
      # Host port 8001 (not 8000) — another local process already holds
      # 8000 on this machine.
      - "8001:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls this directly, so it must be the HOST-mapped
        # backend port (8001 here), not the container-internal one.
        VITE_API_BASE_URL: http://localhost:8001
    container_name: dqe_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dqe_pg_data:
